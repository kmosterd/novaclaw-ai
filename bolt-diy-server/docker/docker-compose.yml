# Alternatieve installatie met Docker in plaats van launchd.
# Zie docker/README.md voor wanneer je dit wilt (en wanneer niet).
#
# Gebruik:  cd docker && cp ~/bolt-diy/.env .env && docker compose up -d

services:
  bolt:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    container_name: bolt-diy
    restart: unless-stopped

    # Bewust gebonden aan 127.0.0.1. Zonder dat prefix publiceert Docker de
    # poort op alle interfaces en omzeilt het zelfs de macOS-firewall, waarmee
    # bolt.diy op je hele LAN zichtbaar zou zijn. Tailscale Serve praat met
    # loopback, dus dit is alles wat nodig is.
    ports:
      - "127.0.0.1:5173:5173"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5173
      RUNNING_IN_DOCKER: "true"

    # Zodat Ollama of LM Studio op de Mac zelf bereikbaar is vanuit de container
    # via http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
